# ============================================================
# app.yaml — Google App Engine Standard (Python 3.11)
# Deploy:  gcloud app deploy
# ============================================================
runtime: python311
instance_class: F2

# Gunicorn as the production WSGI server
entrypoint: gunicorn --config gunicorn.conf.py app:app

# Environment variables (DO NOT put SECRET_KEY here in a public repo;
# use: gcloud app deploy --set-env-vars SECRET_KEY=your-secret)
env_variables:
  FLASK_ENV: "production"
  GUNICORN_WORKERS: "2"
  GUNICORN_THREADS: "4"
  GUNICORN_TIMEOUT: "300"
  LOG_LEVEL: "warning"
  # SITE_URL: "https://YOUR-PROJECT-ID.appspot.com"
  # GA_MEASUREMENT_ID: "G-XXXXXXXXXX"

# Serve static files directly from App Engine CDN (faster + cheaper)
handlers:
  - url: /static
    static_dir: static
    expiration: "365d"
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"
      X-Content-Type-Options: "nosniff"

  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301

# Auto-scaling
automatic_scaling:
  min_idle_instances: 0
  max_idle_instances: automatic
  min_pending_latency: 30ms
  max_pending_latency: automatic
  max_concurrent_requests: 80
  target_cpu_utilization: 0.65

# Skip uploading user-generated and dev files
skip_files:
  - ^(.*/)?\.git(/.*)?$
  - ^(.*/)?\.env$
  - ^(.*/)?__pycache__(/.*)?$
  - ^(.*/)?.*\.pyc$
  - ^static/uploads/(?!\.gitkeep).*$
  - ^outputs/(?!\.gitkeep).*$
  - ^users\.db$
  - ^Dockerfile$
  - ^\.dockerignore$
  - ^venv(/.*)?$
  - ^\.venv(/.*)?$
