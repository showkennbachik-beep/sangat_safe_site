name: SANGAT Live Server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-eng \
            libgl1-mesa-glx libglib2.0-0 \
            libmupdf-dev libfontconfig-dev \
            libjpeg-dev libpng-dev \
            --no-install-recommends -qq

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install --prefer-binary \
            flask flask-compress werkzeug gunicorn \
            python-dotenv \
            PyMuPDF PyPDF2 reportlab pdfplumber pdf2docx \
            Pillow python-pptx python-docx pandas openpyxl \
            deep-translator xhtml2pdf pytesseract \
            --quiet

      - name: Install localtunnel
        run: npm install -g localtunnel --quiet

      - name: Start Flask server
        env:
          SECRET_KEY: sangat-live-${{ github.run_id }}
          FLASK_ENV: production
          PORT: "5000"
        run: |
          nohup python app.py > flask.log 2>&1 &
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz)
          echo "Flask status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Flask log:"
            cat flask.log
          fi

      - name: Start tunnel and show URL
        id: tunnel
        run: |
          NODE_TLS_REJECT_UNAUTHORIZED=0 nohup lt --port 5000 > tunnel.log 2>&1 &
          sleep 10
          URL=$(grep -o 'https://[a-zA-Z0-9-]*\.loca\.lt' tunnel.log | head -1)
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
          echo ""
          echo "=================================================="
          echo "  YOUR LIVE WEBSITE URL:"
          echo "  $URL"
          echo "  Bypass password: $PUBLIC_IP"
          echo "=================================================="
          echo "## 🌐 SANGAT Tools is LIVE!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 Bypass password: \`$PUBLIC_IP\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Enter the bypass password once when you first open the URL" >> $GITHUB_STEP_SUMMARY
          # Save URL to file so it can be read via GitHub API
          git config user.email "bot@sangat.tools"
          git config user.name "SANGAT Bot"
          echo "$URL" > LIVE_URL.txt
          echo "Bypass: $PUBLIC_IP" >> LIVE_URL.txt
          git add LIVE_URL.txt
          git diff --cached --quiet || git commit -m "chore: update live URL [skip ci]"
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:main --force 2>/dev/null || true

      - name: Keep server alive (up to 6 hours)
        run: |
          URL=$(grep -o 'https://[a-zA-Z0-9-]*\.loca\.lt' tunnel.log | head -1)
          echo "Keeping server alive at: $URL"
          for i in $(seq 1 340); do
            sleep 60
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz 2>/dev/null)
            if [ "$STATUS" != "200" ]; then
              nohup python app.py > flask.log 2>&1 &
              sleep 5
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "[$i/340] Still live: $URL"
            fi
          done
