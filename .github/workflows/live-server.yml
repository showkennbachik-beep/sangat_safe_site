name: SANGAT Live Server

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            tesseract-ocr tesseract-ocr-eng \
            libgl1-mesa-glx libglib2.0-0 \
            libjpeg-dev libpng-dev openssh-client \
            --no-install-recommends -qq

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install --prefer-binary \
            flask flask-compress werkzeug gunicorn \
            python-dotenv \
            PyMuPDF PyPDF2 reportlab pdfplumber pdf2docx \
            Pillow python-pptx python-docx pandas openpyxl \
            deep-translator xhtml2pdf pytesseract \
            --quiet

      - name: Start Flask server
        env:
          SECRET_KEY: sangat-live-${{ github.run_id }}
          FLASK_ENV: production
          PORT: "5000"
        run: |
          nohup python app.py > flask.log 2>&1 &
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz)
          echo "Flask status: $STATUS"
          if [ "$STATUS" != "200" ]; then cat flask.log; fi

      - name: Start tunnel (no password page)
        id: tunnel
        run: |
          URL=""

          # Try 1: Pinggy — port 443, no bypass, very reliable
          echo "Trying Pinggy..."
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              -R0:localhost:5000 a.pinggy.io > /tmp/pinggy.log 2>&1 &
          sleep 12
          URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.free\.pinggy\.link' /tmp/pinggy.log | head -1)
          echo "Pinggy URL: $URL"

          # Try 2: localhost.run — no bypass page
          if [ -z "$URL" ]; then
            echo "Trying localhost.run..."
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
                -R 80:localhost:5000 nokey@localhost.run > /tmp/lhr.log 2>&1 &
            sleep 10
            URL=$(grep -oP 'https://[a-zA-Z0-9._-]+\.(lhr\.life|localhost\.run)' /tmp/lhr.log | head -1)
            echo "localhost.run URL: $URL"
          fi

          # Try 3: Serveo
          if [ -z "$URL" ]; then
            echo "Trying Serveo..."
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
                -R 80:localhost:5000 serveo.net > /tmp/serveo.log 2>&1 &
            sleep 10
            URL=$(grep -oP 'https://[a-zA-Z0-9._-]*(serveousercontent\.com|serveo\.net)' /tmp/serveo.log | head -1)
            echo "Serveo URL: $URL"
          fi

          echo ""
          echo "=================================================="
          echo "  SANGAT TOOLS LIVE URL:"
          echo "  $URL"
          echo "  (No password needed — open directly)"
          echo "=================================================="

          # Write to repo so we can read it via API
          git config user.email "bot@sangat.tools"
          git config user.name "SANGAT Bot"
          echo "$URL" > LIVE_URL.txt
          git add LIVE_URL.txt
          git diff --cached --quiet || git commit -m "chore: update live URL [skip ci]"
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:main --force 2>/dev/null || true

          echo "## 🌐 SANGAT Tools is LIVE" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 $URL" >> $GITHUB_STEP_SUMMARY
          echo "> Open directly — no password needed" >> $GITHUB_STEP_SUMMARY

      - name: Keep server alive (up to 6 hours)
        run: |
          echo "Server running. Keeping alive for up to 6 hours..."
          for i in $(seq 1 340); do
            sleep 60
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz 2>/dev/null)
            if [ "$STATUS" != "200" ]; then
              nohup python app.py > flask.log 2>&1 &
              sleep 5
            fi
            # Restart Serveo if it died
            if ! pgrep -f "serveo.net" > /dev/null; then
              ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
                -R 80:localhost:5000 serveo.net > /tmp/serveo.log 2>&1 &
            fi
            if [ $((i % 15)) -eq 0 ]; then echo "[$i/340] Still live"; fi
          done
