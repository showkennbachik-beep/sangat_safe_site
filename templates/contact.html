{% extends 'base.html' %}
{% block title %}Contact - SANGAT Tools{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="header">
        <h1>Contact Support</h1>
        <p>Our enterprise support team is here to help.</p>
    </div>
    
    <form class="upload-form active-form contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
        <div class="input-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required placeholder="John Doe">
        </div>
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="john@example.com">
        </div>
        <div class="input-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" required placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" class="submit-btn" style="margin-top: 10px;">Send Message</button>
    </form>
</div>
{% endblock %}
