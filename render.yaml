services:
  - type: web
    name: sangat-tools
    runtime: docker          # Use Docker so system deps (Tesseract, libgl) are installed
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: FLASK_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: PORT
        value: "8080"
